name: Linux edge-gateway CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-edge-gateway:
    name: Linux edge-gateway build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install C++ and gRPC build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            cmake \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Run repository checks
        run: make check test test-grpc
