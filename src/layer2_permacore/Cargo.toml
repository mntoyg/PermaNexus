[package]
name = "permanexus-permacore"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
default-run = "permanexus-permacore"

[dependencies]
prost = "0.13"
tonic = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
