syntax = "proto3";

package permanexus.actuator.v1;

// PermaCore is the client; the hardware actuator implements this service.
// Calls use configured device IDs and register offsets, never raw addresses.
// The server must enforce device access policy and validate alignment, width,
// register bounds, and values before touching hardware.
service HardwareActuator {
  rpc ReadRegister(ReadRegisterRequest) returns (ReadRegisterResponse);
  rpc WriteRegister(WriteRegisterRequest) returns (WriteRegisterResponse);
  // Read-only deterministic synthetic fixtures in the RAM simulator.
  rpc ReadTelemetry(TelemetryRequest) returns (TelemetryData);
  // Contract scaffolding: the current simulator returns UNIMPLEMENTED.
  rpc ApplyCommand(ActuatorCommand) returns (ActuatorCommandResult);
}

enum RegisterWidth {
  REGISTER_WIDTH_UNSPECIFIED = 0;
  REGISTER_WIDTH_8_BITS = 1;
  REGISTER_WIDTH_16_BITS = 2;
  REGISTER_WIDTH_32_BITS = 3;
  REGISTER_WIDTH_64_BITS = 4;
}

message RegisterAddress {
  // Nonempty identifier resolved through the server's configured allowlist.
  string device_id = 1;
  // Byte offset within the configured register region.
  uint64 offset_bytes = 2;
  // UNSPECIFIED must be rejected with INVALID_ARGUMENT.
  RegisterWidth width = 3;
}

message ReadRegisterRequest {
  RegisterAddress address = 1;
}

message ReadRegisterResponse {
  // Logical unsigned value, zero-extended to 64 bits.
  fixed64 value = 1;
}

message WriteRegisterRequest {
  RegisterAddress address = 1;
  // All bits above the selected register width must be zero.
  fixed64 value = 2;
  // Required precondition for an atomic compare-and-write operation.
  // Absence is INVALID_ARGUMENT; mismatch is ABORTED without a write.
  optional fixed64 expected_value = 3;
}

message WriteRegisterResponse {
  // Previous register value returned after a successful compare-and-write.
  fixed64 previous_value = 1;
}

// Logical names resolved through configured device/component allowlists.
// Each ID must contain 1..64 ASCII letters, digits, underscores, dots, or hyphens.
// IDs are never paths, physical addresses, or caller-supplied register maps.
message ComponentTarget {
  string device_id = 1;
  string component_id = 2;
}

enum TelemetryUnit {
  TELEMETRY_UNIT_UNSPECIFIED = 0;
  TELEMETRY_UNIT_CELSIUS = 1;
  TELEMETRY_UNIT_VOLTS = 2;
  TELEMETRY_UNIT_AMPERES = 3;
  TELEMETRY_UNIT_WATTS = 4;
  TELEMETRY_UNIT_HERTZ = 5;
  // Dimensionless fraction in [0, 1], not a percentage in [0, 100].
  TELEMETRY_UNIT_RATIO = 6;
}

// Device policy defines the allowed transitions and their hardware meaning.
// These labels do not authorize register writes or guarantee energy savings.
enum MicroState {
  MICRO_STATE_UNSPECIFIED = 0;
  MICRO_STATE_ACTIVE = 1;
  MICRO_STATE_IDLE = 2;
  MICRO_STATE_LOW_POWER = 3;
}

message MicroStateSnapshot {
  // UNSPECIFIED and unknown enum values are invalid.
  MicroState state = 1;
  // Required; zero is a valid initial revision. Increment for each successful
  // command, including a same-state command. Never wrap or reuse a revision.
  optional uint64 revision = 2;
  // Exactly 16 bytes identifying the server's current state incarnation.
  // Must change after restart/reset or loss of revision history.
  // This identity is a concurrency precondition, not authentication.
  bytes instance_id = 3;
}

message TelemetryRequest {
  // Required allowlisted component.
  ComponentTarget target = 1;
  // Required allowlisted sensor ID, with the same syntax/length as target IDs.
  string sensor_id = 2;
}

message TelemetryData {
  // Required; must match the request target and sensor ID.
  ComponentTarget target = 1;
  string sensor_id = 2;
  // Required finite reading; absence is not a zero reading.
  optional double value = 3;
  // Required recognized unit matching configured sensor policy.
  TelemetryUnit unit = 4;
  // Required UTC Unix-epoch nanoseconds at sampling; zero is a valid timestamp.
  // Wall-clock time is metadata, not ordering or proof of freshness.
  optional uint64 sampled_at_unix_ns = 5;
  // Required atomic state/revision/instance snapshot for this component.
  // Sensor sampling and this snapshot are not a multi-register transaction.
  MicroStateSnapshot observed_state = 6;
}

message ActuatorCommand {
  // Exactly 16 bytes, echoed for correlation. Not a deduplication/retry token.
  bytes command_id = 1;
  // Required allowlisted component; never an arbitrary hardware address.
  ComponentTarget target = 2;
  // UNSPECIFIED and unknown states are invalid. Device policy must permit it.
  MicroState desired_state = 3;
  // Required state, revision, and instance preconditions checked atomically
  // with the transition. No mutation on mismatch or failed policy checks.
  MicroStateSnapshot expected_state = 4;
}

message ActuatorCommandResult {
  // Echo the request identity and target only after definitive completion.
  bytes command_id = 1;
  ComponentTarget target = 2;
  MicroStateSnapshot previous_state = 3;
  // Same instance, requested state, previous revision + 1.
  MicroStateSnapshot current_state = 4;
}

// Future telemetry/command implementations must enforce these contracts:
// - Validate required presence, ID lengths/syntax, enums, finite readings,
//   sensor units, component permissions, and the existing 4096-byte RPC bound.
// - INVALID_ARGUMENT: invalid shape/value; NOT_FOUND: unknown target/sensor;
//   PERMISSION_DENIED: policy rejects access or a transition.
// - ABORTED: state/revision mismatch; FAILED_PRECONDITION: instance mismatch
//   or exhausted revision counter. Reject both before any state change.
// - UNAVAILABLE: no usable sensor reading or hardware temporarily unavailable.
// - UNIMPLEMENTED: endpoint/backend cannot meet the required safe semantics.
// - Successful ApplyCommand means definitive completion, not queued acceptance.
//   An ambiguous failure must never be reported as proof that no write occurred.
// - Set deadlines and never automatically retry commands, including with the
//   same command_id. Persisted wear accounting requires a separate integration.

// Server errors use canonical gRPC status codes:
// INVALID_ARGUMENT: missing address, invalid width, alignment, or value.
// NOT_FOUND: unknown device ID or register offset.
// PERMISSION_DENIED: access is not allowed by device policy.
// UNIMPLEMENTED: safe atomic compare-and-write is unavailable for this register.
// ABORTED: the expected value did not match; no write occurred.
// UNAVAILABLE: hardware cannot currently be accessed.
// Clients must set deadlines. A timeout does not prove that a write failed;
// writes must not be retried automatically. Non-readable and side-effectful
// registers must reject compare-and-write with UNIMPLEMENTED.
